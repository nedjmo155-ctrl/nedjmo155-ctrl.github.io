let L=(localStorage.getItem("cnl")||((navigator.language||"").startsWith("ar")?"ar":"fr"));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}
function render(){
 const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 $("#langBtn").textContent=L==="ar"?"Français":"العربية";
 $$("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 $$("[data-h]").forEach(e=>e.innerHTML=t[e.dataset.h]);
 $("#featGrid").innerHTML=t.feats.map(f=>`<div class="card"><div class="ic">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join("");
 $("#stepList").innerHTML=t.steps.map(s=>`<div class="step"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
 $("#priceGrid").innerHTML=CFG.plans.map(p=>{const x=t.plans[p.id];return `<div class="card price ${p.featured?"f":""}">${p.featured?`<span class="tag">${t.popular}</span>`:""}<h3>${x[0]}</h3><div style="color:var(--mut);font-size:14px">${x[1]}</div><div class="amt">${p.trial?(L==="ar"?"مجاني":"Gratuit"):p.price} <small>${p.per[L]}</small></div><ul>${x[2].map(i=>`<li>${i}</li>`).join("")}</ul><a class="btn ${p.featured?"p":"s"}" href="#license" data-plan="${p.id}">${p.trial?t.buyT:t.buy}</a></div>`}).join("");
 const cur=$("#fl").value;
 $("#fl").innerHTML=CFG.plans.map(p=>`<option value="${p.id}">${t.plans[p.id][0]} — ${p.trial?(L==="ar"?"مجاني":"gratuit"):p.price+" "+p.per[L]}</option>`).join("");if(cur)$("#fl").value=cur;
 $("#hwHow").innerHTML=t.hw.map(i=>`<li>${i}</li>`).join("");
 $("#payList").innerHTML=CFG.payments.map(p=>`<div><span>${p.name}</span><b>${p.value}</b></div>`).join("");
 $("#faqList").innerHTML=t.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("");
 $("#verLine").textContent="Windows 10 / 11 · 64 bits";
 $("#dlMeta").textContent="ZIP · Windows 10 / 11";
 $("#yr").textContent=new Date().getFullYear();
}
$("#langBtn").onclick=()=>{L=L==="ar"?"fr":"ar";try{localStorage.setItem("cnl",L)}catch(e){}render()};
$$("#dl1,#dl2").forEach(a=>a.href=CFG.download);if(CFG.sha256)$("#shaMeta").textContent="SHA-256 : "+CFG.sha256;
document.addEventListener("click",e=>{const a=e.target.closest("[data-plan]");if(a)$("#fl").value=a.dataset.plan});
const hwEl=$("#fh");
hwEl.addEventListener("input",()=>{let v=hwEl.value.toUpperCase().replace(/[^0-9A-F]/g,"").slice(0,20);hwEl.value=v.match(/.{1,5}/g)?.join("-")||"";$("#eh").textContent=""});
function msg(){
 const t=T[L],p=CFG.plans.find(x=>x.id===$("#fl").value),pn=t.plans[p.id][0];
 const l=[`*${p.trial?t.trialHead:t.msgHead}*`,`${t.f_name}: ${$("#fn").value.trim()}`,`${t.f_phone}: ${$("#fp").value.trim()}`,`${t.f_mail}: ${$("#fe").value.trim()}`,`Code machine: ${hwEl.value}`,`${t.f_plan}: ${pn} (${p.trial?"gratuit":p.price+" "+p.per[L]})`];
 const m=$("#fm").value.trim();if(m)l.push(m);return l.join("\n");
}
function valid(){
 const t=T[L];
 if(!$("#fn").value.trim()){toast(t.needname);$("#fn").focus();return false}
 if(!/^[0-9A-F]{5}(-[0-9A-F]{5}){3}$/.test(hwEl.value)){$("#eh").textContent=t.badhw;hwEl.focus();return false}
 return true;
}
$("#sendWa").onclick=()=>{if(valid())window.open("https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(msg()),"_blank")};
$("#sendMail").onclick=()=>{if(valid())location.href="mailto:"+CFG.email+"?subject="+encodeURIComponent(msg().split("\n")[0].replace(/\*/g,""))+"&body="+encodeURIComponent(msg().replace(/\*/g,""))};
$("#copyBtn").onclick=async()=>{if(!valid())return;try{await navigator.clipboard.writeText(msg());toast(T[L].ok)}catch(e){prompt("",msg())}};
const API=(CFG.api||"").replace(/\/$/,"");
function showRes(t,k,n){const r=$("#res");r.hidden=false;$("#resT").textContent=t;const kk=$("#resK");kk.style.display=k?"block":"none";kk.value=k||"";$("#resA").style.display=k?"flex":"none";$("#resN").textContent=n||"";r.scrollIntoView({behavior:"smooth",block:"center"})}
function payUi(){if(!API)return;$("#payBox").hidden=false;const p=CFG.plans.find(x=>x.id===$("#fl").value);$("#payTxt").textContent=p&&p.trial?T[L].getTrial:T[L].payNow}
$("#fl").addEventListener("change",payUi);
const _r=render;render=function(){_r();payUi()};
$("#resC").onclick=async()=>{try{await navigator.clipboard.writeText($("#resK").value);toast(T[L].ok)}catch(e){$("#resK").select();document.execCommand("copy")}};
$("#payBtn").onclick=async()=>{
 if(!valid())return;const t=T[L],p=CFG.plans.find(x=>x.id===$("#fl").value);const b=$("#payBtn");b.disabled=true;
 try{
  const r=await fetch(API+"/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$("#fn").value.trim(),phone:$("#fp").value.trim(),email:$("#fe").value.trim(),hw:hwEl.value,plan:p.id,pm:$("#pm").value,lang:L})});
  const j=await r.json().catch(()=>({}));
  if(j.ok&&j.key){showRes(t.ready,j.key,t.keyHow);b.disabled=false;return}
  if(j.ok&&j.url){try{localStorage.setItem("cnref",j.ref)}catch(e){}location.href=j.url;return}
  toast(j.err==="trial_used"?t.trialUsed:j.err==="gateway"?t.gwErr:t.netErr+" ("+(j.err||r.status)+")");
 }catch(e){toast(t.netErr+" ("+e.message+")")}
 b.disabled=false;
};
async function pollRef(ref){
 const t=T[L];showRes(t.wait,"","");
 for(let i=0;i<100;i++){
  try{const j=await (await fetch(API+"/key?ref="+ref)).json();if(j.status==="paid"){showRes(t.ready,j.key,t.keyHow+"\n"+t.keySave);return}if(j.status==="none")return}catch(e){}
  await new Promise(r=>setTimeout(r,3000));
 }
 showRes(t.late,"","");
}
render();
if(API){const ref=new URLSearchParams(location.search).get("ref");if(/^[0-9a-f]{32}$/.test(ref||""))pollRef(ref)}
</script>
